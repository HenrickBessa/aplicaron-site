# Dependabot: abre PRs semanais com atualizações. Cada PR passa pelo CI e ganha um preview
# na Vercel antes de qualquer merge. Atualizações de segurança chegam assim que publicadas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Rio_Branco
    open-pull-requests-limit: 5
    # Correções e versões menores juntas num PR só, para não virar ruído.
    groups:
      dependencias-menores:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Rio_Branco
    commit-message:
      prefix: chore
