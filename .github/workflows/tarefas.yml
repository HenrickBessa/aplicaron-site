name: Tarefas agendadas

# Plano Hobby da Vercel só permite cron diário. Este workflow chama a rota de tarefas
# a cada 15 min (novas tentativas de notificação). O cron diário da Vercel (vercel.json)
# fica de reserva: o GitHub desativa agendamentos de repositórios sem atividade por 60 dias.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: # permite rodar na mão pela aba Actions

permissions: {}

concurrency:
  group: tarefas
  cancel-in-progress: false

jobs:
  tarefas:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar /api/cron/tarefas
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          URL_SITE: ${{ vars.URL_SITE }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$URL_SITE" ]; then
            echo "::error::Configure o secret CRON_SECRET e a variável URL_SITE em Settings → Secrets and variables → Actions."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL_SITE/api/cron/tarefas"
