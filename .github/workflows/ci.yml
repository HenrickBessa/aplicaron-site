name: CI

on:
  push:
    branches: [main]
  pull_request:

# O token do GitHub no CI só precisa ler o código.
permissions:
  contents: read

# Um push novo na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Scan de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Procura chaves secret do Supabase (formato sb_secret_ + caracteres da chave) em todo arquivo versionado.
      - name: Nenhuma chave sb_secret_ no repositório
        run: |
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]{10,}'; then
            echo "::error::Chave secret do Supabase encontrada no repositório. Remova e rotacione a chave."
            exit 1
          fi

  app:
    name: Typecheck, lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  banco:
    name: Banco, integração e E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Só os serviços que os testes usam: Postgres, PostgREST, Kong (gateway) e Auth (gera as chaves novas).
      - run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
      - run: npm run test:integracao
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Relatório do Playwright (se falhar)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
